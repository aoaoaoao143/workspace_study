<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インディアンポーカー（モックアップ）</title>
    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="indian-poker-page">
    <header class="header">
        <div class="header-title">インディアンポーカー</div>
        <div class="header-center">
            <button class="header-toggle" id="toggleMockupBtn">モックアップ設定</button>
        </div>

        <div class="header-buttons">
            <a href="game_start.html">
                <button class="header-btn">
                    <img src="./img/button_home.png" alt="ホーム">
                </button>
            </a>
            <div class="menu" onclick="togglePopup()">≡</div> <!-- クリックでポップアップ -->
        </div>
    </header>

    <section id="mockConfigPanel"></section>

    <main class="main">
        <div class="pot" id="potLabel">現在の賭け金: チップ0枚</div>
        <div id="dealArea"><button id="startBtn">カードを配る</button></div>

        <div class="table-area" id="tableArea" hidden>
            <div class="npc-row" id="npcRow"></div>
            <div class="you-area">
                <img class="you-card" id="youCard" src="./img/trump/0_card-back.png" alt="自分カード">
                <div class="my-action-display" id="myActionDisplay"></div>
                <div class="ip-action-row" id="firstActionRow">
                    <button class="ip-img-btn" data-action="check"><img src="./img/game-btn_check.png"
                            alt="check"></button>
                    <button class="ip-img-btn" data-action="bet"><img src="./img/game-btn_bet.png" alt="bet"></button>
                </div>
                <div class="center-next" id="nextRow" hidden>
                    <button class="next-btn" id="nextBetBtn">次の賭けに進む</button>
                </div>
                <div class="ip-action-row" id="nextActionRow" hidden>
                    <button class="ip-img-btn" data-action="fold"><img src="./img/game-btn_fold.png"
                            alt="fold"></button>
                    <button class="ip-img-btn" data-action="call"><img src="./img/game-btn_call.png"
                            alt="call"></button>
                    <button class="ip-img-btn" data-action="raise"><img src="./img/game-btn_raise.png"
                            alt="raise"></button>
                    <button class="ip-img-btn" data-action="all-in"><img src="./img/game-btn_all-in.png"
                            alt="all-in"></button>
                </div>
                <div class="post-hand-row" id="postHandRow" hidden>
                    <button class="continue-btn" id="continueBtn">ゲーム継続</button>
                    <button class="end-btn" id="endBtn">ゲーム終了</button>
                </div>
            </div>
        </div>
    </main>

    <dialog id="resultDialog">
        <h3 style="margin-top:0;color:#222;">ゲーム結果（モック）</h3>
        <div class="ip-dialog-row" id="chipsStart"></div>
        <div class="ip-dialog-row" id="chipsEnd"></div>
        <div class="ip-dialog-row" id="winYou"></div>
        <div class="ip-dialog-row" id="winNpc1"></div>
        <div class="ip-dialog-row" id="winNpc2"></div>
        <div class="ip-dialog-row" id="winNpc3"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;">
            <button class="popup-btn" onclick="location.href='game_start.html'">ホームに戻る</button>
            <button class="popup-btn" onclick="location.href='trump.html'">他のトランプゲームを選ぶ</button>
            <button class="popup-btn" onclick="location.href='settings.html?game=indianpoker'">設定画面に戻る</button>
            <button class="popup-btn" id="retryBtn">リトライ</button>
        </div>
    </dialog>

    <script src="./js/t-g_IndianPoker.js"></script>
</body>

</html>
