        .pot {
            text-align: center;
            font-size: 18px;
            margin: 8px 0 24px;
        }

        #dealArea {
            text-align: center;
            margin-bottom: 24px;
        }

        #startBtn,
        .next-btn,
        .continue-btn,
        .end-btn,
        .popup-btn {
            padding: 10px 18px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            background: #f2f2f2;
            color: #222;
        }

        .table-area {
            max-width: 980px;
            margin: 0 auto;

        .npc-row {
            display: flex;
            justify-content: center;

            min-height: 230px;
            margin-bottom: 16px;
        }

        .participant {
            position: relative;
            width: 190px;
            text-align: center;
        }

        .npc-action {
            color: #fff;
            min-height: 28px;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .npc-wrap {
            position: relative;
            width: 140px;
            margin: 0 auto;
            height: 170px;
        }

        .card {
            width: 140px;
            position: absolute;
            top: 35px;
            left: 0;
            z-index: 1;
            border-radius: 8px;
        }

        .npc-img {
            width: 140px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .you-area {
            text-align: center;
        }

        }

        .my-action-display,
        .post-hand-row {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .img-btn {
            width: 190px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .img-btn img {
            width: 100%;
            border-radius: 8px;
        }

        .center-next {
            text-align: center;
            margin-top: 20px;

        dialog {
            width: min(620px, 92vw);
            border: none;
            border-radius: 12px;
            padding: 20px;
        }

            margin: 6px 0;
            color: #333;

            .header-title {
                font-size: 30px;

<body>
    <header class="header">
        <div class="header-title">インディアンポーカー</div>
        <div class="header-center">
            <button class="header-toggle" id="toggleMockupBtn">モックアップ設定</button>
        </div>

        <div class="header-buttons">
            <a href="game_start.html">
                <button class="header-btn">
                    <img src="./img/button_home.png" alt="ホーム">
                </button>
            </a>
            <div class="menu" onclick="togglePopup()">≡</div> <!-- クリックでポップアップ -->
        </div>
    </header>

    <section id="mockConfigPanel"></section>

    <main class="main">
        <div class="pot" id="potLabel">現在の賭け金: チップ0枚</div>
        <div id="dealArea"><button id="startBtn">カードを配る</button></div>

        <div class="table-area" id="tableArea" hidden>
            <div class="npc-row" id="npcRow"></div>
            <div class="you-area">
                <img class="you-card" id="youCard" src="./img/trump/0_card-back.png" alt="自分カード">
                <div class="my-action-display" id="myActionDisplay"></div>
                <div class="action-row" id="firstActionRow">
                    <button class="img-btn" data-action="check"><img src="./img/game-btn_check.png"
                            alt="check"></button>
                    <button class="img-btn" data-action="bet"><img src="./img/game-btn_bet.png" alt="bet"></button>
                </div>
                <div class="center-next" id="nextRow" hidden>
                    <button class="next-btn" id="nextBetBtn">次の賭けに進む</button>
                </div>
                <div class="action-row" id="nextActionRow" hidden>
                    <button class="img-btn" data-action="fold"><img src="./img/game-btn_fold.png" alt="fold"></button>
                    <button class="img-btn" data-action="call"><img src="./img/game-btn_call.png" alt="call"></button>
                    <button class="img-btn" data-action="raise"><img src="./img/game-btn_raise.png"
                            alt="raise"></button>
                    <button class="img-btn" data-action="all-in"><img src="./img/game-btn_all-in.png"
                            alt="all-in"></button>
                </div>
                <div class="post-hand-row" id="postHandRow" hidden>
                    <button class="continue-btn" id="continueBtn">ゲーム継続</button>
                    <button class="end-btn" id="endBtn">ゲーム終了</button>
                </div>
            </div>
        </div>
    </main>

    <dialog id="resultDialog">
        <h3 style="margin-top:0;color:#222;">ゲーム結果（モック）</h3>
        <div class="dialog-row" id="chipsStart"></div>
        <div class="dialog-row" id="chipsEnd"></div>
        <div class="dialog-row" id="winYou"></div>
        <div class="dialog-row" id="winNpc1"></div>
        <div class="dialog-row" id="winNpc2"></div>
        <div class="dialog-row" id="winNpc3"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;">
            <button class="popup-btn" onclick="location.href='game_start.html'">ホームに戻る</button>
            <button class="popup-btn" onclick="location.href='trump.html'">他のトランプゲームを選ぶ</button>
            <button class="popup-btn" onclick="location.href='settings.html?game=indianpoker'">設定画面に戻る</button>
            <button class="popup-btn" id="retryBtn">リトライ</button>
        </div>
    </dialog>

    <script src="./js/t-g_IndianPoker.js"></script>
</body>

</html>
